name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Check cask style
        run: brew style Casks/galley.rb

      - name: Audit cask
        run: brew audit --cask --online Casks/galley.rb
