name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # `brew audit` takes cask names, not paths, so this checkout has to sit
      # in Homebrew's Taps directory before it can be audited. Copying it there
      # avoids `brew tap`'s remote-URL check, which rejects a local path once
      # the tap is also known from GitHub.
      - name: Install this checkout as a tap
        run: |
          TAP="$(brew --repository)/Library/Taps/munepi/homebrew-galley"
          mkdir -p "$(dirname "$TAP")"
          cp -R "$GITHUB_WORKSPACE" "$TAP"
          brew tap

      - name: Check cask style
        run: brew style munepi/galley

      - name: Audit cask
        run: brew audit --cask --online munepi/galley/galley
